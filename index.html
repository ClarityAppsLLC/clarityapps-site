<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarity Apps LLC</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f0f;
        color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }
      .logo {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase; 
        color: #888;
        margin-bottom: 32px;
      }
      h1 {
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 700;
        letter-spacing: -1px;
        text-align: center;
        line-height: 1.1;
        margin-bottom: 20px;
      }
      p {
        font-size: 18px;
        color: #999;  
        text-align: center;
        max-width: 480px;
        line-height: 1.6;
        margin-bottom: 40px;
      }
      .links {
        display: flex;
        gap: 16px;
        flex-wrap: wrap; 
        justify-content: center;
        margin-bottom: 48px;
      }
      .btn {
        font-size: 14px;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-family: inherit;
      }
      .btn-primary {  
        background: #f5f5f5;
        color: #0f0f0f;
        font-weight: 600;
      }
      .btn-secondary {
        background: transparent;
        color: #888;
        border: 1px solid #333;
      }
      .btn:hover { opacity: 0.8; } 
      footer {
        position: fixed;
        bottom: 28px;
        font-size: 13px;
        color: #444;  
      }
      footer a { color: #666; text-decoration: none; }
      footer a:hover { color: #aaa; }
    </style>
  </head>
  <body>
    <div class="logo">Clarity Apps LLC</div>
    <h1>Mobile apps, beautifully made.</h1>
    <p>We build thoughtful iOS and Android applications. Our first app, Divinity, brings
  Scripture to life with daily verses, reading plans, and community.</p>
    <div class="links">
      <a href="/support" class="btn btn-primary">Divinity Support</a>
      <a href="/privacy" class="btn btn-secondary">Privacy Policy</a>
    </div>
    <footer>
      &copy; 2026 Clarity Apps LLC &nbsp;·&nbsp;
      <a href="mailto:support@clarityapps.info">support@clarityapps.info</a>
    </footer>
  </body>
  </html>
