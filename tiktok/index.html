<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divinity — The Bible App</title>
  <meta name="description" content="A daily verse, guided reading plans, and a place to pray together. Divinity by Clarity Apps LLC." />
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      background: #F4E4C1;
      background-image: linear-gradient(170deg, #FBF3E2 0%, #F4E4C1 55%, #EBD3A3 100%);
      color: #3B2A16;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px 24px 32px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    /* main takes the slack and centres inside it; the footer stays in normal
       flow beneath. An absolutely-positioned footer overlapped the store buttons
       on a landscape phone (844x390), where the content is taller than one
       viewport — measured, not guessed. */
    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .mark { width: 76px; height: 76px; margin-bottom: 28px; }
    h1 {
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
      max-width: 12ch;
    }
    p.lede {
      font-size: clamp(17px, 2.4vw, 20px);
      line-height: 1.6;
      color: #6B5334;
      max-width: 30ch;
      margin-bottom: 40px;
    }
    .stores { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .store {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* They stack on a phone, where two different widths read as a mistake. */
      min-width: 196px;
      gap: 11px;
      background: #241A0E;
      color: #FFFFFF;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 11px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .store:hover { opacity: 0.88; transform: translateY(-1px); }
    .store svg { flex: 0 0 auto; }
    .store .lines { text-align: left; line-height: 1.15; }
    .store .top {
      display: block;
      font-size: 10px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      opacity: 0.75;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .store .bottom {
      display: block;
      font-size: 18px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    footer {
      flex: 0 0 auto;
      padding-top: 56px;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    footer, footer a { color: #8A7350; }
    footer a { text-decoration: none; }
    footer a:hover { color: #5E4A2B; }
    @media (prefers-reduced-motion: reduce) { .store { transition: none; } }
  </style>
</head>
<body>
